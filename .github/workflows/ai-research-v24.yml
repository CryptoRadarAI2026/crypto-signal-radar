name: AI Research V24 - Real Data Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: V24 Market Data Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Create report directory
        run: |
          mkdir -p reports/v24

      - name: Download public market data
        shell: bash
        run: |
          set -euo pipefail

          python ai-research/train_public_data.py \
            --days 90 \
            2>&1 | tee reports/v24/data_pipeline.log

      - name: Validate downloaded market data
        shell: bash
        run: |
          set -euo pipefail

          for pair in BTCUSD ETHUSD SOLUSD; do
            input="data/raw/COINBASE_${pair}_1.csv"
            output="reports/v24/diagnostics_${pair}.json"

            if [ ! -s "$input" ]; then
              echo "ERROR: Missing or empty file: $input"
              exit 1
            fi

            echo "Validating $pair"

            python ai-research/v24/diagnose.py \
              --input "$input" \
              --output "$output"
          done

      - name: Upload V24 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-diagnostics-reports
          path: |
            reports/v24/
            reports/real_data_training.json
            reports/source_manifest.json
          retention-days: 30
