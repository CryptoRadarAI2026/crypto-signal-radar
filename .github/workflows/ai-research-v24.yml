name: AI Research V24 - Real Data Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: V24 Market Data Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create report directory
        run: |
          mkdir -p reports/v24

      - name: Download public market data
        shell: bash
        run: |
          set -o pipefail
          python ai-research/train_public_data.py \
            --days 90 \
            2>&1 | tee reports/v24/data_pipeline.log

      - name: Locate OHLCV CSV files
        shell: bash
        run: |
          find . -type f -name "*.csv" \
            -not -path "./.git/*" \
            > reports/v24/csv_files.txt

          echo "CSV files found:"
          cat reports/v24/csv_files.txt

      - name: Run V24 diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          csv_list = Path("reports/v24/csv_files.txt")

          files = [
              line.strip()
              for line in csv_list.read_text().splitlines()
              if line.strip()
          ]

          if not files:
              raise SystemExit(
                  "No CSV files found for V24 diagnostics"
              )

          print(f"Found {len(files)} CSV files")

          for index, file in enumerate(files):
              output = (
                  f"reports/v24/diagnostics_{index}.json"
              )

              print(f"Checking: {file}")

              subprocess.run(
                  [
                      "python",
                      "ai-research/v24/diagnose.py",
                      "--input",
                      file,
                      "--output",
                      output,
                  ],
                  check=True,
              )

          print("V24 diagnostics completed")
          PY

      - name: Upload V24 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-diagnostics-reports
          path: reports/v24/
          retention-days: 30
