name: V24.8 BTC Paper Trading

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "FIRST RUN ONLY - initialize 10000 virtual USD"
        type: boolean
        required: true
        default: false

  # Enable only after successful manual restore test:
  # schedule:
  #   - cron: "10 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: v248-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    name: BTC Paper Trading Research
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      V248_RESTORE_REQUIRED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Restore previous paper state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          repo = os.environ["REPO"]
          bootstrap = (
              os.environ["BOOTSTRAP"].lower() == "true"
          )
          event_name = os.environ["EVENT_NAME"]

          state_dir = Path("research-output/v248")
          state_dir.mkdir(parents=True, exist_ok=True)

          state_path = state_dir / "state.json"

          workflow = "ai-research-v248-paper.yml"

          def gh_json(*args):
              result = subprocess.run(
                  ["gh", "api", *args],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=60,
              )
              return json.loads(result.stdout)

          def validate_state(data):
              if not isinstance(data, dict):
                  raise RuntimeError(
                      "Invalid state structure"
                  )

              if data.get("version") != "V24.8":
                  raise RuntimeError(
                      "Invalid state version"
                  )

              if (
                  data.get("status")
                  != "PAPER_TRADING_ONLY"
              ):
                  raise RuntimeError(
                      "Invalid state status"
                  )

              sequence = data.get("sequence")

              if (
                  not isinstance(sequence, int)
                  or isinstance(sequence, bool)
                  or sequence < 1
              ):
                  raise RuntimeError(
                      "Invalid state sequence"
                  )

              for field in ("cash", "btc"):
                  value = data.get(field)

                  if (
                      not isinstance(value, (int, float))
                      or isinstance(value, bool)
                      or value < 0
                  ):
                      raise RuntimeError(
                          "Invalid balance: " + field
                      )

              if not isinstance(
                  data.get("trades"), list
              ):
                  raise RuntimeError(
                      "Invalid trade history"
                  )

              if not isinstance(
                  data.get("events"), list
              ):
                  raise RuntimeError(
                      "Invalid event history"
                  )

          print("Searching previous successful runs")

          runs = []

          for page in range(1, 6):
              response = gh_json(
                  "-X",
                  "GET",
                  (
                      f"repos/{repo}/actions/workflows/"
                      f"{workflow}/runs"
                      f"?status=success"
                      f"&per_page=100"
                      f"&page={page}"
                  ),
              )

              batch = response.get(
                  "workflow_runs", []
              )

              if not batch:
                  break

              runs.extend(batch)

              if len(batch) < 100:
                  break

          runs.sort(
              key=lambda r: r.get(
                  "run_number", 0
              ),
              reverse=True,
          )

          restored = False

          for run in runs:
              if run.get("head_branch") != "main":
                  continue

              run_id = run["id"]

              artifacts_response = gh_json(
                  "-X",
                  "GET",
                  (
                      f"repos/{repo}/actions/runs/"
                      f"{run_id}/artifacts"
                      "?per_page=100"
                  ),
              )

              artifacts = artifacts_response.get(
                  "artifacts", []
              )

              state_artifacts = [
                  artifact
                  for artifact in artifacts
                  if (
                      artifact.get("name")
                      == "v248-paper-state"
                      and not artifact.get(
                          "expired", False
                      )
                  )
              ]

              if not state_artifacts:
                  continue

              if len(state_artifacts) != 1:
                  raise RuntimeError(
                      "Ambiguous state artifacts"
                  )

              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(
                      [
                          "gh",
                          "run",
                          "download",
                          str(run_id),
                          "--repo",
                          repo,
                          "--name",
                          "v248-paper-state",
                          "--dir",
                          tmp,
                      ],
                      check=True,
                      timeout=120,
                  )

                  matches = list(
                      Path(tmp).rglob("state.json")
                  )

                  if len(matches) != 1:
                      raise RuntimeError(
                          "Missing or ambiguous state.json"
                      )

                  data = json.loads(
                      matches[0].read_text(
                          encoding="utf-8"
                      )
                  )

                  validate_state(data)

                  state_path.write_text(
                      json.dumps(
                          data,
                          indent=2,
                      ),
                      encoding="utf-8",
                  )

                  print(
                      "Restored from run:",
                      run.get("run_number"),
                  )
                  print(
                      "Restored sequence:",
                      data["sequence"],
                  )

                  restored = True
                  break

          if restored:
              print(
                  "Previous state restored successfully"
              )

          elif bootstrap:
              if event_name != "workflow_dispatch":
                  raise RuntimeError(
                      "Bootstrap forbidden for schedule"
                  )

              if runs:
                  raise RuntimeError(
                      "Previous successful runs exist. "
                      "Refusing unsafe bootstrap."
                  )

              print(
                  "First-run bootstrap permitted"
              )

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8",
              ) as env_file:
                  env_file.write(
                      "V248_RESTORE_REQUIRED=0\n"
                  )

          else:
              raise RuntimeError(
                  "No previous state found. "
                  "Refusing capital reset."
              )
          PY

      - name: Run observational paper trading
        run: |
          python ai-research/v248/paper.py

      - name: Validate and persist state
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          folder = Path("research-output/v248")

          state_path = folder / "state.json"
          report_path = folder / "report.json"

          if not state_path.is_file():
              raise RuntimeError(
                  "Missing state.json"
              )

          if not report_path.is_file():
              raise RuntimeError(
                  "Missing report.json"
              )

          state = json.loads(
              state_path.read_text(
                  encoding="utf-8"
              )
          )

          report = json.loads(
              report_path.read_text(
                  encoding="utf-8"
              )
          )

          if state.get("version") != "V24.8":
              raise RuntimeError(
                  "Invalid state version"
              )

          if (
              state.get("status")
              != "PAPER_TRADING_ONLY"
          ):
              raise RuntimeError(
                  "Invalid state status"
              )

          if report.get("version") != "V24.8":
              raise RuntimeError(
                  "Invalid report version"
              )

          if (
              report.get("status")
              != "PAPER_TRADING_ONLY"
          ):
              raise RuntimeError(
                  "Invalid report status"
              )

          if report.get("orders_sent") != 0:
              raise RuntimeError(
                  "Real orders are forbidden"
              )

          sequence = state.get("sequence")

          if (
              not isinstance(sequence, int)
              or isinstance(sequence, bool)
              or sequence < 1
          ):
              raise RuntimeError(
                  "Invalid sequence"
              )

          if sequence != report.get("sequence"):
              raise RuntimeError(
                  "State/report sequence mismatch"
              )

          for field in ("cash", "btc"):
              value = state.get(field)

              if (
                  not isinstance(value, (int, float))
                  or isinstance(value, bool)
                  or not math.isfinite(value)
                  or value < 0
              ):
                  raise RuntimeError(
                      "Invalid balance: " + field
                  )

          if not isinstance(
              state.get("trades"), list
          ):
              raise RuntimeError(
                  "Invalid trades"
              )

          if not isinstance(
              state.get("events"), list
          ):
              raise RuntimeError(
                  "Invalid events"
              )

          print(
              "Validated sequence:",
              sequence,
          )

          print(
              "Virtual cash:",
              state["cash"],
          )

          print(
              "Virtual BTC:",
              state["btc"],
          )

          print(
              "Closed trades:",
              len(state["trades"]),
          )
          PY

      - name: Upload persistent paper state
        uses: actions/upload-artifact@v4
        with:
          name: v248-paper-state
          path: research-output/v248/state.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload readable paper report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v248-paper-report
          path: research-output/v248/report.json
          if-no-files-found: error
          retention-days: 90
