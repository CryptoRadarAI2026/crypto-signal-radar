name: V24.8 BTC Paper Trading

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v248-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    name: BTC Paper Trading Research
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Run V24.8 paper simulator
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python ai-research/v248/paper.py

      - name: Upload paper trading state and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v248-paper-reports
          path: research-output/v248/
          if-no-files-found: warn
          retention-days: 90
