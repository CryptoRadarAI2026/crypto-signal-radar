name: V24.8 BTC Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"

permissions:
  contents: read

concurrency:
  group: v248-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn

      - name: Run paper trading
        run: |
          python ai-research/v248/paper.py

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v248-paper-reports
          path: research-output/v248/
          if-no-files-found: warn
