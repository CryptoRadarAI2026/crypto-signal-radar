name: AI Research V14 - Economic Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economic-diagnostics:
    name: Validation economic diagnostics only
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Download public historical candles
        run: |
          mkdir -p data/raw

          python - <<'PY'
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, "ai-research")

          from train_public_data import download
          from v11.research_v11 import PAIRS

          days = 90
          end = int(time.time()) // 86400 * 86400
          start = end - days * 86400

          for pair in PAIRS:
              path = Path("data/raw") / (
                  f"COINBASE_{pair.replace('-', '')}_{days}D_1M.csv"
              )

              meta = download(pair, start, end, path)
              print(pair, meta, flush=True)
          PY

      - name: Run V14 economic diagnostics
        run: |
          python ai-research/v14/research_v14.py \
            --data-dir data/raw \
            --output reports/v14/economic_diagnostics.json

      - name: Upload V14 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-economic-diagnostics-report
          path: reports/v14/economic_diagnostics.json
          if-no-files-found: warn
          retention-days: 30
