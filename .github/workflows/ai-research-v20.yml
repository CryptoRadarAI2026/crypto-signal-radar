name: AI Research V20 - Synthetic Architecture Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Run V20 synthetic-only checks
        run: python ai-research/v20/diagnostics_v20.py
      - name: Upload report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-v20-report
          path: reports/v20/integrity.json
          if-no-files-found: warn
          retention-days: 30
