name: V24.7 BTC Research Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: BTC Research Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile \
            ai-research/v245/backtest_engine.py \
            ai-research/v246/run_historical_backtest.py \
            ai-research/v247/backtest_engine.py \
            ai-research/v247/signal_generator.py \
            ai-research/v247/run_validation.py \
            ai-research/v247/test_backtest_engine.py

      - name: Run V24.5 safety tests
        run: |
          python -m unittest discover \
            -s ai-research/v245 \
            -p "test_backtest_engine.py" \
            -v

      - name: Run V24.5 correctness tests
        run: |
          python -m unittest discover \
            -s ai-research/v245 \
            -p "test_backtest_correctness.py" \
            -v

      - name: Run V24.7 tests
        run: |
          python -m unittest discover \
            -s ai-research/v247 \
            -p "test_backtest_engine.py" \
            -v

      - name: Prepare research directories
        run: |
          mkdir -p research-data/v247
          mkdir -p research-output/v247

      - name: Download BTC research candles
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          DAYS = 14
          STEP = 250 * 60

          output_dir = Path("research-data/v247")
          report_dir = Path("research-output/v247")

          output_dir.mkdir(parents=True, exist_ok=True)
          report_dir.mkdir(parents=True, exist_ok=True)

          csv_path = output_dir / "btc_usd_1m.csv"
          audit_path = report_dir / "data_audit.json"

          end_ts = (int(time.time()) // 60) * 60 - 60
          start_ts = end_ts - DAYS * 86400

          rows = {}
          errors = []

          def iso(ts):
              return datetime.fromtimestamp(
                  ts, tz=timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ")

          for batch_start in range(start_ts, end_ts, STEP):
              batch_end = min(batch_start + STEP, end_ts)

              params = urllib.parse.urlencode({
                  "start": iso(batch_start),
                  "end": iso(batch_end),
                  "granularity": 60,
              })

              url = (
                  "https://api.exchange.coinbase.com/"
                  "products/BTC-USD/candles?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "BTC-Research-V247/1.0",
                      "Accept": "application/json",
                  }
              )

              response_data = None

              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=30
                      ) as response:
                          response_data = json.load(response)
                      break
                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      json.JSONDecodeError
                  ) as exc:
                      if attempt == 4:
                          errors.append(str(exc))
                      else:
                          time.sleep(2 ** attempt)

              if response_data is None:
                  continue

              if not isinstance(response_data, list):
                  errors.append("Unexpected API response")
                  continue

              for item in response_data:
                  try:
                      if not isinstance(item, list) or len(item) < 6:
                          raise ValueError("Invalid candle row")

                      ts = int(item[0])
                      low = float(item[1])
                      high = float(item[2])
                      opening = float(item[3])
                      closing = float(item[4])
                      volume = float(item[5])

                      if not start_ts <= ts < end_ts:
                          continue

                      if ts % 60 != 0:
                          raise ValueError("Unaligned timestamp")

                      if not (
                          0 < low <= min(opening, closing)
                          and high >= max(opening, closing)
                          and high >= low
                          and volume >= 0
                      ):
                          raise ValueError("Invalid OHLCV")

                      row = (
                          ts, opening, high,
                          low, closing, volume
                      )

                      if ts in rows and rows[ts] != row:
                          errors.append("Conflicting duplicate candle")

                      rows[ts] = row

                  except (TypeError, ValueError) as exc:
                      errors.append(str(exc))

              time.sleep(0.15)

          timestamps = sorted(rows)

          longest = []
          current = []

          for ts in timestamps:
              if current and ts != current[-1] + 60:
                  if len(current) > len(longest):
                      longest = current
                  current = []
              current.append(ts)

          if len(current) > len(longest):
              longest = current

          selected = [rows[ts] for ts in longest]

          if selected:
              with csv_path.open(
                  "w", newline="", encoding="utf-8"
              ) as file:
                  writer = csv.writer(file)
                  writer.writerow([
                      "timestamp", "open", "high",
                      "low", "close", "volume"
                  ])
                  writer.writerows(selected)

              digest = hashlib.sha256(
                  csv_path.read_bytes()
              ).hexdigest()
          else:
              digest = None

          audit = {
              "version": "V24.7",
              "status": "RESEARCH_ONLY_NOT_APPROVED",
              "source": "Coinbase Exchange public API",
              "requested_days": DAYS,
              "requested_candles": (end_ts - start_ts) // 60,
              "received_unique_candles": len(rows),
              "selected_contiguous_candles": len(longest),
              "selected_start": longest[0] if longest else None,
              "selected_end": longest[-1] if longest else None,
              "sha256": digest,
              "errors": errors[:30],
              "data_origin_verified": False,
              "research_only": True,
              "trading_enabled": False,
              "note": (
                  "Public API download; independent "
                  "source authentication not performed."
              ),
          }

          audit_path.write_text(
              json.dumps(audit, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(audit, indent=2))

          if errors:
              raise SystemExit("BTC data audit failed")

          if len(longest) < 7 * 1440:
              raise SystemExit(
                  "Insufficient continuous BTC data"
              )

          print("BTC data integrity check passed.")
          PY

      - name: Run V24.7 research validation
        run: |
          python ai-research/v247/run_validation.py \
            --candles research-data/v247/btc_usd_1m.csv

      - name: Upload V24.7 research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v247-btc-research-validation
          path: |
            research-output/v247/
          if-no-files-found: warn
          retention-days: 14
