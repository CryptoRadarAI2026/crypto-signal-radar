name: V24.7 BTC Research Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: BTC Research Validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create output directories
        run: |
          mkdir -p research-data/v247
          mkdir -p research-output/v247

      - name: Download BTC-USD historical candles
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          DATA_DIR = Path("research-data/v247")
          OUTPUT_DIR = Path("research-output/v247")

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)

          CSV_PATH = DATA_DIR / "btc_usd_1m.csv"
          AUDIT_PATH = OUTPUT_DIR / "data_audit.json"

          GRANULARITY = 60
          DAYS = 14
          REQUESTED = DAYS * 24 * 60

          # Latest fully completed UTC minute.
          now = int(time.time())
          end_ts = (now // 60) * 60
          start_ts = end_ts - REQUESTED * 60

          base_url = (
              "https://api.exchange.coinbase.com/"
              "products/BTC-USD/candles"
          )

          headers = {
              "User-Agent": "CryptoRadarAI2026-Research/24.7",
              "Accept": "application/json",
          }

          candles = {}
          errors = []
          cursor = start_ts

          while cursor < end_ts:
              # Coinbase limits requests to 300 candles.
              next_cursor = min(
                  cursor + 299 * 60,
                  end_ts,
              )

              params = urllib.parse.urlencode(
                  {
                      "start": datetime.fromtimestamp(
                          cursor,
                          timezone.utc,
                      ).isoformat(),
                      "end": datetime.fromtimestamp(
                          next_cursor,
                          timezone.utc,
                      ).isoformat(),
                      "granularity": GRANULARITY,
                  }
              )

              url = base_url + "?" + params
              response_data = None

              for attempt in range(5):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=headers,
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30,
                      ) as response:
                          response_data = json.loads(
                              response.read().decode("utf-8")
                          )

                      if not isinstance(response_data, list):
                          raise ValueError(
                              "Unexpected Coinbase response"
                          )

                      break

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      ValueError,
                  ) as exc:
                      if attempt == 4:
                          errors.append(str(exc))
                      else:
                          time.sleep(2 * (attempt + 1))

              if response_data is None:
                  raise RuntimeError(
                      "Candle download failed: "
                      + "; ".join(errors)
                  )

              for row in response_data:
                  if not isinstance(row, list) or len(row) < 6:
                      continue

                  timestamp = int(row[0])

                  if (
                      timestamp < start_ts
                      or timestamp >= end_ts
                      or timestamp % 60 != 0
                  ):
                      continue

                  # Coinbase format:
                  # [time, low, high, open, close, volume]
                  candles[timestamp] = {
                      "timestamp": timestamp,
                      "open": float(row[3]),
                      "high": float(row[2]),
                      "low": float(row[1]),
                      "close": float(row[4]),
                      "volume": float(row[5]),
                  }

              cursor = next_cursor
              time.sleep(0.15)

          if not candles:
              raise RuntimeError("No candles downloaded")

          ordered = [
              candles[t]
              for t in sorted(candles)
          ]

          # Find longest continuous one-minute segment.
          segments = []
          current = [ordered[0]]

          for candle in ordered[1:]:
              if (
                  candle["timestamp"]
                  - current[-1]["timestamp"]
                  == 60
              ):
                  current.append(candle)
              else:
                  segments.append(current)
                  current = [candle]

          segments.append(current)

          selected = max(
              segments,
              key=len,
          )

          if len(selected) < 1000:
              raise RuntimeError(
                  "Insufficient contiguous candles"
              )

          with CSV_PATH.open(
              "w",
              newline="",
              encoding="utf-8",
          ) as file:
              writer = csv.writer(file)

              writer.writerow(
                  [
                      "timestamp",
                      "open",
                      "high",
                      "low",
                      "close",
                      "volume",
                  ]
              )

              for candle in selected:
                  writer.writerow(
                      [
                          candle["timestamp"],
                          candle["open"],
                          candle["high"],
                          candle["low"],
                          candle["close"],
                          candle["volume"],
                      ]
                  )

          sha256 = hashlib.sha256(
              CSV_PATH.read_bytes()
          ).hexdigest()

          audit = {
              "version": "V24.7",
              "status": "RESEARCH_ONLY_NOT_APPROVED",
              "source": "Coinbase Exchange public API",
              "requested_days": DAYS,
              "requested_candles": REQUESTED,
              "received_unique_candles": len(ordered),
              "selected_contiguous_candles": len(selected),
              "selected_start": selected[0]["timestamp"],
              "selected_end": selected[-1]["timestamp"],
              "sha256": sha256,
              "errors": errors,
              "data_origin_verified": False,
              "research_only": True,
              "trading_enabled": False,
              "note": (
                  "Public API download; independent source "
                  "authentication not performed."
              ),
          }

          AUDIT_PATH.write_text(
              json.dumps(
                  audit,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(json.dumps(audit, indent=2))
          PY

      - name: Run V24.7 research validation
        shell: bash
        run: |
          python ai-research/v247/run_validation.py \
            --candles research-data/v247/btc_usd_1m.csv \
            --output research-output/v247/validation_report.json

      - name: Verify validation report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "research-output/v247/validation_report.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "ERROR: validation_report.json not found"
              )

          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          if report.get("version") != "V24.7":
              raise SystemExit(
                  "ERROR: Unexpected report version"
              )

          if report.get("status") != (
              "RESEARCH_ONLY_NOT_APPROVED"
          ):
              raise SystemExit(
                  "ERROR: Research safety status mismatch"
              )

          if "holdout_one_pass" not in report:
              raise SystemExit(
                  "ERROR: Holdout result field missing"
              )

          print("Validation report exists and is readable.")
          print(
              "Holdout result:",
              report["holdout_one_pass"],
          )
          PY

      - name: Upload V24.7 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v247-research-reports
          path: |
            research-output/v247/data_audit.json
            research-output/v247/validation_report.json
          if-no-files-found: warn
          retention-days: 30
