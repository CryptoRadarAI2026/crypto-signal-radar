
name: Historical Market AI Research V3 (Paper Only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Public market history: 90 or 120 days'
        required: true
        type: choice
        default: '90'
        options:
          - '90'
          - '120'

permissions:
  contents: read

concurrency:
  group: ai-research-v3-manual
  cancel-in-progress: false

jobs:
  research-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 170

    defaults:
      run:
        working-directory: ai-research

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-research/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline safety tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s v2/tests -v
          python -m unittest discover -s v3/tests -v

      - name: Run V3 research on public historical data
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/v3
          python -u v3/research_v3.py --days '${{ inputs.days }}' 2>&1 | tee reports/v3/pipeline.log

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-v3-report-${{ github.run_id }}
          path: ai-research/reports/v3/
          retention-days: 14
          if-no-files-found: warn
