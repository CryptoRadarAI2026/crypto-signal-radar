name: Historical Market AI Research V11 (Validation Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-v11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn

      - name: Check V11 files
        run: |
          ls -la ai-research/v11

      - name: Check V11 Python syntax
        run: |
          python -m py_compile ai-research/v11/research_v11.py

      - name: V11 isolated safety tests
        run: |
          if [ -d ai-research/v11/tests ]; then
            python -m unittest discover -s ai-research/v11/tests -v
          else
            echo "Safety tests directory not found."
            exit 1
          fi

      - name: Historical research validation only
        run: |
          python ai-research/v11/research_v11.py

      - name: Upload V11 research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-validation-reports
          path: reports/v11/
          if-no-files-found: warn
          retention-days: 30
