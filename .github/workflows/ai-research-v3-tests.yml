name: Crypto Radar AI V3 - Offline Safety Tests

on:
  push:
    branches:
      - 'ai-research-v3-*'
    paths:
      - 'ai-research/v3/**'
      - '.github/workflows/ai-research-v3*.yml'
  pull_request:
    paths:
      - 'ai-research/v3/**'
      - '.github/workflows/ai-research-v3*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-research-v3-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-safety-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-research/requirements.txt
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run V1 + V2 + V3 offline correctness/safety tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s v2/tests -v
          python -m unittest discover -s v3/tests -v
