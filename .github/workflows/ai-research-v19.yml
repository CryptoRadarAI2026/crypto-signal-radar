name: AI Research V19 - Synthetic Backtest Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v19:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install numpy
      - name: Run synthetic-only V19 integrity checks
        run: python ai-research/v19/diagnostics_v19.py
      - name: Upload V19 report even on failed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-v19-report
          path: reports/v19/backtest_integrity.json
          if-no-files-found: warn
          retention-days: 30
