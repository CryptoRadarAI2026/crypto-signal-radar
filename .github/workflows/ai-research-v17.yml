name: AI Research V17 - Descriptive Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scikit-learn
      - name: Download historical data
        shell: bash
        run: |
          mkdir -p data/raw
          python - <<'PY'
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'ai-research')
          from train_public_data import download
          from v11.research_v11 import PAIRS
          days = 90
          end = int(time.time()) // 86400 * 86400
          start = end - days * 86400
          for pair in PAIRS:
              path = Path('data/raw') / f"COINBASE_{pair.replace('-', '')}_{days}D_1M.csv"
              print(pair, download(pair, start, end, path), flush=True)
          PY
      - name: Reproduce V16 baseline
        run: python ai-research/v16/diagnostics_v16.py
      - name: Run V17 descriptive diagnostics
        run: python ai-research/v17/diagnostics_v17.py
      - name: Upload V17 report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-v17-report
          path: reports/v17/trade_quality_diagnostics.json
          if-no-files-found: error
