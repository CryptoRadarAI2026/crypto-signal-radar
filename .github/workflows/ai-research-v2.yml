name: Historical Market AI Research V2 (Paper Only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Public 1-minute OHLCV history (90 or 120 days)'
        required: true
        type: choice
        default: '90'
        options:
          - '90'
          - '120'

permissions:
  contents: read

concurrency:
  group: ai-research-v2-manual
  cancel-in-progress: false

jobs:
  research-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        working-directory: ai-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-research/requirements.txt
      - name: Install required packages
        run: python -m pip install -r requirements.txt
      - name: Check old and new safety tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s v2/tests -v
      - name: Download REAL history, evaluate research models (no trading)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/v2
          python -u v2/research_v2.py --days '${{ inputs.days }}' 2>&1 | tee reports/v2/pipeline.log
      - name: Archive offline dashboard and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-v2-report-${{ github.run_id }}
          path: ai-research/reports/v2/
          retention-days: 14
          if-no-files-found: warn
